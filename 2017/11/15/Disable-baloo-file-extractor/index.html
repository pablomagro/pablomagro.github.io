    <h2 id="Disable-baloo-file-extractor-KDE-5"><a href="#Disable-baloo-file-extractor-KDE-5" class="headerlink" title="Disable baloo-file-extractor (KDE 5)"></a>Disable baloo-file-extractor (KDE 5)</h2><p>Run below command from the console:</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">$ balooctl status</span><br><span class="line">$ balooctl <span class="built_in">disable</span></span><br></pre></td></tr></table></figure>

<p>Remove the local content:</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">$ <span class="built_in">rm</span> -rfv ~/.local/share/baloo</span><br></pre></td></tr></table></figure>
